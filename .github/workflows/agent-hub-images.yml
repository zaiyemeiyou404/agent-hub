name: Agent Hub Images

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Public API URL baked into the Next.js frontend
        required: false
        type: string
  push:
    paths:
      - 'workspace/backend/**'
      - 'workspace/frontend/**'
      - 'workspace/docker-compose.agent-hub.images.yml'
      - '.github/workflows/agent-hub-images.yml'

permissions:
  contents: read

concurrency:
  group: agent-hub-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: agent-hub-backend
            context: workspace/backend
          - component: frontend
            image: agent-hub-frontend
            context: workspace/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.component }}
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ inputs.api_url || vars.AGENT_HUB_API_URL || 'http://localhost:8000' }}
            RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=agent-hub-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=agent-hub-${{ matrix.component }}
      - name: Attest published image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  smoke:
    needs: build
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AGENT_HUB_IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Initialize disposable image deployment
        run: |
          bash scripts/agent-hub-init.sh
          npm ci --prefix packages/agent-connector --ignore-scripts --no-audit --no-fund
      - name: Pull and start the published images
        run: docker compose --env-file workspace/.env -f workspace/docker-compose.agent-hub.images.yml up -d --pull always --wait --wait-timeout 180
      - name: Verify HTTP, agent messaging and shared files
        run: |
          curl --fail http://localhost:8000/ready
          curl --fail --output /dev/null http://localhost:3000
          node scripts/agent-hub-smoke.cjs
      - name: Service logs
        if: failure()
        run: docker compose --env-file workspace/.env -f workspace/docker-compose.agent-hub.images.yml logs --tail=100
      - name: Remove disposable containers and test volumes
        if: always()
        run: docker compose --env-file workspace/.env -f workspace/docker-compose.agent-hub.images.yml down -v
