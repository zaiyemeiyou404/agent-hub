name: Agent Hub Images

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Public API URL baked into the Next.js frontend
        required: false
        type: string
  push:
    paths:
      - 'workspace/backend/**'
      - 'workspace/frontend/**'
      - 'workspace/docker-compose.agent-hub.images.yml'
      - '.github/workflows/agent-hub-images.yml'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: agent-hub-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: agent-hub-backend
            context: workspace/backend
          - component: frontend
            image: agent-hub-frontend
            context: workspace/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.component }}
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ inputs.api_url || vars.AGENT_HUB_API_URL || 'http://localhost:8000' }}
            RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=agent-hub-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=agent-hub-${{ matrix.component }}
      - name: Attest published image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
