site_name: AgentHub 产品化计划
site_description: AgentHub 移动端、桌面端与 Linux 服务端产品化实施基线
site_url: https://aghub.zaiyemeiyou.com/product-plan/
docs_dir: .product-plan-site-src
site_dir: ../.site/product-plan
use_directory_urls: true
strict: true

theme:
  name: material
  language: zh
  palette:
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
    - scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
  features:
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest

nav:
  - 项目计划书: index.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - zh
        - en

extra:
  generator: false

copyright: AgentHub Client 产品化计划 · v2.0 · 2026-10-20
