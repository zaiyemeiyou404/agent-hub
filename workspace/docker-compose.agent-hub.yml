name: agent-hub

x-backend: &backend
  image: agent-hub-backend:local
  build:
    context: ./backend
    dockerfile: production.Dockerfile
  environment: &backend-env
    DATABASE_URL: postgresql://postgres:${DB_PASSWORD:?Run scripts/agent-hub-init.sh first}@db:5432/openagents_workspace
    AUTH_MODE: workspace_token
    IDENTITY_MODE: standalone
    CORS_ORIGINS: ${WEB_URL:-http://localhost:3000}
    FRONTEND_BASE_URL: ${WEB_URL:-http://localhost:3000}
    WORKSPACE_ENDPOINT: ${API_URL:-http://localhost:8000}
    PUBLIC_API_BASE: ${API_URL:-http://localhost:8000}
    FILE_STORAGE_BACKEND: local
    FILE_STORAGE_PATH: /data/files
    ANALYTICS_ENABLED: "false"
    YUMI_ENABLED: "false"
    WEB_CONCURRENCY: "1"
    DB_POOL_SIZE: "10"
    DB_MAX_OVERFLOW: "5"
    THREADPOOL_TOKENS: "15"
    THREAD_COLLABORATION_ENABLED: "true"
    THREAD_AGENT_ACCESS_ENABLED: "true"
    COMPLETION_ROUTING_ENABLED: "true"
    AUTOMATIC_REVIEW_HANDOFF_ENABLED: "true"
    COMPLETION_ROUTING_MAX_HANDOFFS: ${COMPLETION_ROUTING_MAX_HANDOFFS:-6}
    ROUTER_LLM_ENABLED: ${ROUTER_LLM_ENABLED:-false}
    ROUTER_LLM_PROVIDER: ${ROUTER_LLM_PROVIDER:-openai}
    ROUTER_LLM_MODEL: ${ROUTER_LLM_MODEL:-}
    ROUTER_LLM_API_KEY: ${ROUTER_LLM_API_KEY:-}
    ROUTER_LLM_BASE_URL: ${ROUTER_LLM_BASE_URL:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openagents_workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/agent-hub-init.sh first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d openagents_workspace"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *backend
    restart: "no"
    entrypoint: [alembic]
    command: [upgrade, head]
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - files:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000}
        NEXT_PUBLIC_INLINE_LOGIN: "1"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  files:
